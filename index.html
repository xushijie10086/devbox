<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevBox · 本地开发工具箱</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="logo"></span>
          <span class="brand-name">DevBox</span>
        </div>
        <nav id="nav">
          <button class="nav-item active" data-view="projects"><span class="label">项目库</span></button>
          <button class="nav-item" data-view="profiles"><span class="label">启动组</span></button>
          <button class="nav-item" data-view="ports"><span class="label">端口</span></button>
          <button class="nav-item" data-view="services"><span class="label">服务</span></button>
          <button class="nav-item" data-view="hosts"><span class="label">Hosts</span></button>
          <button class="nav-item" data-view="logs"><span class="label">日志</span></button>
        </nav>
        <div class="sidebar-footer">
          <button id="refresh-all" class="ghost-btn"><span class="label">刷新</span></button>
        </div>
      </aside>
      <main class="content">
        <div id="view-root"></div>
      </main>
    </div>
    <div id="toast-root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
