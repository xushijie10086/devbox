name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # 也可以在 Actions 页面手动运行

# 同一分支上有新提交时，取消还在跑的旧任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 固定 Rust 版本，避免 clippy 随新版本新增规则而让 CI 无故变红；升级时在这里改一处
  RUST_TOOLCHAIN: 1.97.0

jobs:
  # 前端：纯逻辑测试（含 Rust / npm 的 Tauri 版本一致性检查）、构建、MCP 适配器语法
  frontend:
    name: 前端测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            devbox-mcp/package-lock.json
      - run: npm ci
      - name: 测试
        run: npm test
      - name: 构建
        run: npm run build
      - name: MCP 适配器
        working-directory: devbox-mcp
        run: |
          npm ci
          node --check index.js

  # Rust：clippy（警告即失败）+ 单元测试，macOS / Linux / Windows 三个平台各跑一遍。
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash # Windows 默认是 PowerShell，这里统一用 bash，命令写法三个平台一致
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf lsof
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri-build 要求前端产物目录存在；测试和 clippy 本身用不到里面的内容
      - run: mkdir -p dist
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: 单元测试
        working-directory: src-tauri
        run: cargo test --lib --locked

  # 整个应用能否编译打包（不生成安装包，只验证前端 + Rust 能一起构建），三个平台各一份
  build:
    name: 应用构建 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri -- build --debug --no-bundle

  # 手动运行（Actions 页面 → Run workflow）：在真实 macOS 上验证「创建证书 → 签名 → 打包」整条流程。
  # 平时不跑（耗时较长），改动 scripts/ 下的签名脚本或 src-tauri/Info.plist 之后用。
  signing:
    name: 签名流程 (macOS)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: 准备临时钥匙串（不碰 runner 的登录钥匙串）
        run: |
          kc="$RUNNER_TEMP/devbox-ci.keychain-db"
          pw=$(uuidgen)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$kc"
          echo "KEYCHAIN_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: 创建证书（跑两次，第二次应当直接说已存在）
        env:
          CI_TRUST_ADMIN: "1"
        run: |
          scripts/create-signing-cert.sh
          scripts/create-signing-cert.sh | tee second.txt
          grep -q "无需重复创建" second.txt
          security find-identity -v -p codesigning

      - name: 发布用的导入脚本：导入 .p12 → 签名 → 身份固定
        env:
          CI: "true"
        run: |
          d="$RUNNER_TEMP/imp"; mkdir -p "$d"; cd "$d"
          # 造一张和 create-signing-cert.sh 同样用途的证书，导出成 .p12，模拟「从本机导出再放进 Secrets」
          name="DevBox Import Test"
          cat > openssl.cnf <<CNF
          [req]
          distinguished_name = dn
          x509_extensions = ext
          prompt = no
          [dn]
          CN = $name
          [ext]
          basicConstraints = critical,CA:false
          keyUsage = critical,digitalSignature
          extendedKeyUsage = critical,codeSigning
          CNF
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 30 -config openssl.cnf -keyout key.pem -out cert.pem 2>/dev/null
          /usr/bin/openssl pkcs12 -export -inkey key.pem -in cert.pem -name "$name" -out id.p12 -passout pass:test-pass
          export SIGNING_CERT_P12="$(/usr/bin/openssl base64 -A -in id.p12)"
          export SIGNING_CERT_PASSWORD=test-pass
          "$GITHUB_WORKSPACE/scripts/import-signing-cert.sh" | tee out.txt
          grep -q "已导入签名身份：$name" out.txt
          grep -q "^APPLE_SIGNING_IDENTITY=$name\$" "$GITHUB_ENV"
          printf '#include <stdio.h>\nint main(void){return 0;}\n' > t.c
          cc t.c -o a && cp a b
          codesign --force -s "$name" -i dev.devbox.app a
          codesign --force -s "$name" -i dev.devbox.app b
          codesign -dr - a 2>&1 | tee a.txt
          grep -q 'certificate leaf' a.txt
          ! grep -q 'cdhash' a.txt
          # 两个不同的二进制，指定要求（身份）完全一样 = 升级后授权不会失效
          diff <(codesign -dr - a 2>&1 | grep -i designated) <(codesign -dr - b 2>&1 | grep -i designated)

      # 上一步的 .p12 是 openssl 造的，和用户从「钥匙串访问」导出的格式不一样（v1.4.0 发布就栽在这里：
      # 脚本用 openssl 解析钥匙串导出的 .p12，抽出来的证书是空的）。这一步改让 macOS 自己导出再导入
      - name: 发布用的导入脚本（.p12 由钥匙串导出，更接近真实使用）
        timeout-minutes: 5
        env:
          CI: "true"
        run: |
          d="$RUNNER_TEMP/exp"; mkdir -p "$d"; cd "$d"
          name="DevBox Export Test"
          cat > openssl.cnf <<CNF
          [req]
          distinguished_name = dn
          x509_extensions = ext
          prompt = no
          [dn]
          CN = $name
          [ext]
          basicConstraints = critical,CA:false
          keyUsage = critical,digitalSignature
          extendedKeyUsage = critical,codeSigning
          CNF
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 30 -config openssl.cnf -keyout key.pem -out cert.pem 2>/dev/null
          /usr/bin/openssl pkcs12 -export -inkey key.pem -in cert.pem -name "$name" -out gen.p12 -passout pass:gen-pass
          # 放进单独的钥匙串（-A：允许导出私钥），再用 security export 导出，和「钥匙串访问」导出的 .p12 同源
          kc2="$d/exp.keychain-db"
          security create-keychain -p kcpass "$kc2"
          security unlock-keychain -p kcpass "$kc2"
          security import gen.p12 -k "$kc2" -P gen-pass -A >/dev/null
          security export -k "$kc2" -t identities -f pkcs12 -P export-pass -o exported.p12
          security delete-keychain "$kc2"
          ls -l exported.p12
          export SIGNING_CERT_P12="$(/usr/bin/openssl base64 -A -in exported.p12)"
          export SIGNING_CERT_PASSWORD=export-pass
          "$GITHUB_WORKSPACE/scripts/import-signing-cert.sh" | tee out.txt
          grep -q "已导入签名身份：${name}" out.txt
          printf '#include <stdio.h>\nint main(void){return 0;}\n' > t.c
          cc t.c -o a && codesign --force -s "$name" -i dev.devbox.app a
          codesign -dr - a 2>&1 | tee a.txt
          grep -q 'certificate leaf' a.txt
          ! grep -q 'cdhash' a.txt
          echo "--- 密码不对时要有明确的报错，而不是莫名其妙失败"
          export SIGNING_CERT_PASSWORD=wrong-pass
          if "$GITHUB_WORKSPACE/scripts/import-signing-cert.sh" > bad.txt 2>&1; then echo "密码不对却成功了"; exit 1; fi
          grep -q "导入 .p12 失败" bad.txt

      - name: 开发模式：sign-and-run.sh 用固定证书签名
        run: |
          d="$RUNNER_TEMP/sr"; mkdir -p "$d"; cd "$d"
          printf '#include <stdio.h>\nint main(void){puts("devbox-sim");return 0;}\n' > t.c
          cc t.c -o devbox
          cp devbox adhoc
          out=$("$GITHUB_WORKSPACE/scripts/sign-and-run.sh" ./devbox)
          echo "运行输出：$out"; [ "$out" = "devbox-sim" ]
          codesign -dr - ./devbox 2>&1 | tee dr.txt
          grep -q 'identifier "dev.devbox.app"' dr.txt
          grep -q 'certificate leaf' dr.txt
          ! grep -q 'cdhash' dr.txt
          echo "--- 对照：临时签名（现在的情况）"
          codesign --force -s - adhoc
          codesign -dr - adhoc 2>&1 | tee adhoc.txt
          grep -q 'cdhash' adhoc.txt

      - name: 打包：scripts/build-signed.sh
        run: scripts/build-signed.sh

      - name: 检查打出来的 App
        run: |
          app=$(ls -d src-tauri/target/release/bundle/macos/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dr - "$app" 2>&1 | tee dr.txt
          grep -q 'identifier "dev.devbox.app"' dr.txt
          grep -q 'certificate leaf' dr.txt
          ! grep -q 'cdhash' dr.txt
          echo "--- 弹窗用途说明是否打进了应用"
          /usr/libexec/PlistBuddy -c "Print :NSDocumentsFolderUsageDescription" "$app/Contents/Info.plist"
          ls src-tauri/target/release/bundle/dmg/*.dmg
