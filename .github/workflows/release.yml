name: Release

# 推送 v* 标签：三平台打包并发布 GitHub Release。
# 修改本文件的 PR 与手动运行（workflow_dispatch）只会打包验证，不会发布。
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.97.0 # 与 ci.yml 保持一致

jobs:
  check:
    name: 检查版本与更新日志
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 标签与版本号必须一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(node -p "require('./package.json').version")
          if [ "$want" != "$have" ]; then
            echo "::error::标签是 ${GITHUB_REF_NAME}，但 package.json 的版本是 ${have}；请先把所有版本号改成 ${want} 再打标签"
            exit 1
          fi

      - name: CHANGELOG.md 里必须有当前版本的说明
        run: |
          ver=$(node -p "require('./package.json').version")
          if ! awk -v v="$ver" '$0 ~ "^## " v {f=1; next} /^## /{f=0} f' CHANGELOG.md | grep -q .; then
            echo "::error::CHANGELOG.md 里没有 ${ver} 的更新说明"
            exit 1
          fi

      - name: 测试
        run: npm test

  build:
    name: 打包 (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 通用
            os: macos-latest
            artifact: devbox-macos
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            build_args: --target universal-apple-darwin --bundles dmg,app
          - name: Windows
            os: windows-latest
            artifact: devbox-windows
            rust_targets: ""
            build_args: --bundles nsis
          - name: Linux
            # 用较老的系统打包，deb / AppImage 才能在更多发行版上运行
            os: ubuntu-22.04
            artifact: devbox-linux
            rust_targets: ""
            build_args: --bundles deb,appimage
    defaults:
      run:
        shell: bash
    env:
      # AppImage 打包工具自己也是 AppImage，CI 里没有 FUSE，需要解包运行
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      # macOS 按「代码签名身份」记住文件夹授权：每个版本都用同一张证书签名，用户升级后就不会再弹框。
      # 证书从本机导出放进仓库 Secrets，步骤见 README「发布包也固定签名」。
      - name: 导入固定签名证书 (macOS)
        if: runner.os == 'macOS'
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$SIGNING_CERT_P12" ] || [ -z "$SIGNING_CERT_PASSWORD" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::没有配置 SIGNING_CERT_P12 / SIGNING_CERT_PASSWORD。没有固定证书打出来的包，用户每次升级都会重新弹「想访问文稿文件夹」。请先按 README「发布包也固定签名」配置，再在 Actions 里 Re-run 这次发布"
              exit 1
            fi
            echo "::warning::没有配置 SIGNING_CERT_P12，这次打出的是临时签名（只用于验证打包，不要发布）"
            exit 0
          fi
          scripts/import-signing-cert.sh

      - name: 打包
        run: npm run tauri -- build ${{ matrix.build_args }}

      - name: 检查签名身份 (macOS)
        if: runner.os == 'macOS'
        run: |
          [ -n "${APPLE_SIGNING_IDENTITY:-}" ] || { echo "未配置固定证书，跳过检查"; exit 0; }
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/DevBox.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dr - "$app" 2>&1 | tee dr.txt
          grep -q 'identifier "dev.devbox.app"' dr.txt
          # 固定证书的签名是 certificate leaf = H"…"；临时签名是 cdhash H"…"，每次构建都不同
          grep -q 'certificate leaf' dr.txt
          ! grep -q 'cdhash' dr.txt

      - name: 整理产物 (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          out=dist-release
          mkdir -p "$out"
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          cp "$bundle"/dmg/*.dmg "$out"/
          ditto -c -k --sequesterRsrc --keepParent "$bundle/macos/DevBox.app" "$out/DevBox_universal.app.zip"
          ls -la "$out"

      - name: 整理产物 (Windows)
        if: runner.os == 'Windows'
        run: |
          set -e
          out=dist-release
          mkdir -p "$out"
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "$out"/
          ls -la "$out"

      - name: 整理产物 (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          out=dist-release
          mkdir -p "$out"
          cp src-tauri/target/release/bundle/deb/*.deb "$out"/
          cp src-tauri/target/release/bundle/appimage/*.AppImage "$out"/
          ls -la "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-release/*
          if-no-files-found: error

  publish:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: devbox-*
          merge-multiple: true
          path: dist-release

      - name: 生成校验值
        run: |
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: 从 CHANGELOG.md 取本版本的说明
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '$0 ~ "^## " v {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md 里没有 ${ver} 的更新说明"
            exit 1
          fi
          cat >> notes.md <<'NOTE'

          ---

          ### 安装

          | 系统 | 下载 | 说明 |
          |---|---|---|
          | macOS | `.dmg` | 拖进「应用程序」。Apple Silicon 与 Intel 通用 |
          | Windows | `-setup.exe` | 双击安装，装在当前用户目录，不需要管理员权限 |
          | Linux | `.deb` / `.AppImage` | Debian / Ubuntu 用 `.deb`（`sudo apt install ./DevBox_*.deb`）；其他发行版用 `.AppImage`（`chmod +x` 后直接运行） |

          应用目前没有做代码签名，首次打开系统会拦一下：
          - **macOS**：提示「无法验证开发者」时，在「应用程序」里右键 DevBox → 打开；或终端执行 `xattr -cr /Applications/DevBox.app`
          - **Windows**：SmartScreen 提示「已保护你的电脑」时，点「更多信息」→「仍要运行」
          - **Linux**：无需额外操作

          `SHA256SUMS.txt` 是各文件的校验值。
          NOTE

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-release/* \
            --title "DevBox ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag
