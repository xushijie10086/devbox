<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- 底板：深蓝对角渐变 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26335f"/>
      <stop offset="1" stop-color="#0b1022"/>
    </linearGradient>
    <!-- 底板顶部的一抹柔光 -->
    <radialGradient id="glow" cx="0.5" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#5b8dff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#5b8dff" stop-opacity="0"/>
    </radialGradient>
    <!-- 立方体三个面：顶面最亮，左面居中，右面最暗 -->
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4d0ff"/>
      <stop offset="1" stop-color="#6c9cff"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f86ff"/>
      <stop offset="1" stop-color="#2b55d6"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3566e6"/>
      <stop offset="1" stop-color="#1a399e"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#06103a" flood-opacity="0.45"/>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="190"/></clipPath>
  </defs>

  <!-- macOS 图标规范：824 的主体居中，四周留白 -->
  <rect x="100" y="112" width="824" height="824" rx="190" fill="#000" opacity="0.28" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)"/>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- 底板内侧的细高光边 -->
    <rect x="102" y="102" width="820" height="820" rx="188" fill="none" stroke="#9db8ff" stroke-opacity="0.22" stroke-width="3"/>
  </g>

  <g transform="translate(0,-8)">
    <!-- 立方体落在底板上的投影 -->
    <ellipse cx="512" cy="826" rx="236" ry="38" fill="#02040f" opacity="0.55" filter="url(#shadow)"/>

    <!-- 三个面 -->
    <polygon points="512,222 772,372 512,522 252,372" fill="url(#top)"/>
    <polygon points="252,372 512,522 512,822 252,672" fill="url(#left)"/>
    <polygon points="512,522 772,372 772,672 512,822" fill="url(#right)"/>

    <!-- 棱线高光 -->
    <polyline points="252,372 512,522 772,372" fill="none" stroke="#e6f0ff" stroke-opacity="0.75" stroke-width="5" stroke-linejoin="round"/>
    <line x1="512" y1="522" x2="512" y2="822" stroke="#cfe0ff" stroke-opacity="0.35" stroke-width="4"/>
    <polygon points="512,222 772,372 512,522 252,372" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="4" stroke-linejoin="round"/>

    <!-- 终端提示符 >_：> 在左面，_ 在右面，折线的位置按各自面的透视算好，笔画粗细一致 -->
    <g filter="url(#soft)" fill="none" stroke="#ffffff" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="340.4,504 434,627 340.4,642"/>
      <line x1="558.8" y1="717" x2="683.6" y2="645"/>
    </g>
  </g>
</svg>
